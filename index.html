<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manbr - تيليجرام الآمن</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- شاشة المصادقة الحقيقية (الخطوات الأربع) -->
    <div id="authScreen" class="auth-screen">
        <div class="auth-card">
            <h2>تطبيق Manbr</h2>
            <p>يرجى تسجيل الدخول للمتابعة</p>

            <!-- خطوة 1: البريد الإلكتروني -->
            <div id="step1Email" class="auth-step">
                <input type="email" id="authEmailInput" placeholder="أدخل البريد الإلكتروني" required>
                <button id="sendOtpBtn" class="primary-btn">إرسال كود التحقق</button>
            </div>

            <!-- خطوة 2: كود التحقق (6 أرقام) -->
            <div id="step2Otp" class="auth-step" style="display: none;">
                <p>أدخل الكود المرسل إلى بريدك</p>
                <div class="otp-inputs">
                    <input type="text" maxlength="1" class="otp-box">
                    <input type="text" maxlength="1" class="otp-box">
                    <input type="text" maxlength="1" class="otp-box">
                    <input type="text" maxlength="1" class="otp-box">
                    <input type="text" maxlength="1" class="otp-box">
                    <input type="text" maxlength="1" class="otp-box">
                </div>
                <button id="verifyOtpBtn" class="primary-btn">تحقق من الكود</button>
                <button id="resendOtpBtn" class="text-btn">إعادة إرسال الكود</button>
            </div>

            <!-- خطوة 3: كلمة المرور -->
            <div id="step3Password" class="auth-step" style="display: none;">
                <input type="password" id="authPasswordInput" placeholder="كلمة المرور الجديدة">
                <input type="password" id="authConfirmPasswordInput" placeholder="تأكيد كلمة المرور">
                <button id="savePasswordBtn" class="primary-btn">تأكيد كلمة المرور</button>
            </div>

            <!-- خطوة 4: إنشاء البروفايل وUsername الفريد -->
            <div id="step4Profile" class="auth-step" style="display: none;">
                <input type="text" id="profileFirstName" placeholder="الاسم الأول">
                <input type="text" id="profileLastName" placeholder="الاسم الأخير">
                <input type="text" id="profileUsername" placeholder="اسم المستخدم (مثل: @username)">
                <button id="finishRegisterBtn" class="primary-btn">إنهاء وإنشاء الحساب</button>
            </div>
        </div>
    </div>

    <!-- التطبيق الرئيسي (مخفي حتى يتم تسجيل الدخول) -->
    <div id="appContainer" class="app-container" style="display: none;">
        <div class="sidebar">
            <h3>المحادثات</h3>
            <div class="search-box">
                <input type="text" id="globalSearchInput" placeholder="ابحث عن اسم أو @username">
            </div>
            <div id="searchResultsList"></div>
        </div>

        <div id="mainContentArea" class="main-content">
            <div class="chat-header">
                <h4 id="mainChatName">اختر محادثة</h4>
            </div>
            <div id="msgList" class="msg-list"></div>
            <div class="chat-input-area">
                <input type="text" id="msgInput" placeholder="اكتب رسالة...">
                <button id="sendBtn">إرسال</button>
            </div>
        </div>

        <!-- شريط التنقل السفلي 4 خيارات -->
        <div class="bottom-nav">
            <div class="nav-item active" data-target="chats">المحادثات</div>
            <div class="nav-item" data-target="contacts">جهات الاتصال</div>
            <div class="nav-item" data-target="settings">الإعدادات</div>
            <div class="nav-item" data-target="profile">الملف الشخصي</div>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
