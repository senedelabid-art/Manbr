<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manbr - مانبر</title>
    <!-- استدعاء ملف التصميم الخارجي -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- القائمة الجانبية -->
    <div class="sidebar">
        <div class="sidebar-header">
            <button class="menu-btn" id="menuToggle">&#9776;</button>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="بحث...">
            </div>
        </div>
        <div class="chat-list" id="chatList">
            <div class="chat-item active">
                <div class="avatar" style="background-color: #e17076;">أ</div>
                <div class="chat-info">
                    <div class="chat-name-time">
                        <span class="chat-name">مرحباً بك في مانبر</span>
                        <span class="chat-time">الآن</span>
                    </div>
                    <div class="chat-last-msg">تم تحديث البنية التحتية بنجاح!</div>
                </div>
            </div>
        </div>
    </div>

    <!-- منطقة المحادثة -->
    <div class="main-chat">
        <div class="chat-header">
            <span style="font-weight: 600;" id="currentChatTitle">تطبيق مانبر (Manbr)</span>
        </div>
        <div class="chat-messages" id="msgList">
            <div class="message incoming">أهلاً بك يا بطل! المشروع الآن يعمل بملفات منفصلة وبنية تحتية نظيفة تليق بعام 2026.</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="msgInput" placeholder="اكتب رسالة...">
            <button class="send-btn" id="sendBtn">&#10148;</button>
        </div>
    </div>

    <!-- استدعاء ملف الوظائف والمنطق الخارجي -->
    <script src="js/app.js"></script>
</body>
</html>
