<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manbr - مانبر</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- القائمة الجانبية -->
    <div class="sidebar">
        <div class="sidebar-header">
            <button class="menu-btn" id="menuToggle">&#9776;</button>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="بحث في المحادثات...">
            </div>
        </div>
        
        <!-- القائمة الجانبية المنسدلة -->
        <div class="side-menu" id="sideMenu" style="display: none;">
            <div class="menu-item" id="openSettings">⚙️ الإعدادات والملف الشخصي</div>
            <div class="menu-item" id="openNewGroup">👥 إنشاء مجموعة جديدة</div>
        </div>

        <div class="chat-list" id="chatList">
            <div class="chat-item active" data-name="مرحباً بك في مانبر">
                <div class="avatar" id="mainAvatar" style="background-color: #e17076;">أ</div>
                <div class="chat-info">
                    <div class="chat-name-time">
                        <span class="chat-name" id="mainChatName">مرحباً بك في مانبر</span>
                        <span class="chat-time">الآن</span>
                    </div>
                    <div class="chat-last-msg">تمت إضافة ميزات البحث والاتصال!</div>
                </div>
            </div>
        </div>
    </div>

    <!-- منطقة المحادثة -->
    <div class="main-chat">
        <div class="chat-header">
            <div>
                <span style="font-weight: 650; display: block;" id="currentChatTitle">تطبيق مانبر (Manbr)</span>
                <span style="font-size: 11px; color: #707579;" id="onlineStatus">متصل الآن</span>
            </div>
        </div>
        <div class="chat-messages" id="msgList">
            <!-- الرسائل -->
        </div>
        <div class="chat-input-area">
            <input type="text" id="msgInput" placeholder="اكتب رسالة...">
            <button class="send-btn" id="sendBtn">&#10148;</button>
        </div>
    </div>

    <!-- نافذة الإعدادات المنبثقة -->
    <div class="modal" id="settingsModal" style="display: none;">
        <div class="modal-content">
            <h3>تعديل الملف الشخصي والإعدادات</h3>
            <input type="text" id="usernameInput" placeholder="اسمك الجديد...">
            <div class="modal-buttons">
                <button id="saveSettings">حفظ</button>
                <button id="closeSettings" style="background: #e17076;">إغلاق</button>
            </div>
        </div>
    </div>

    <!-- نافذة إنشاء مجموعة جديدة -->
    <div class="modal" id="groupModal" style="display: none;">
        <div class="modal-content">
            <h3>إنشاء مجموعة جديدة</h3>
            <input type="text" id="groupNameInput" placeholder="اسم المجموعة...">
            <div class="modal-buttons">
                <button id="createGroupBtn">إنشاء</button>
                <button id="closeGroup" style="background: #e17076;">إغلاق</button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
