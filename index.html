<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menbr Chat</title>
    <style>
        :root {
            --bg-color: #0e1621;
            --surface-color: #17212b;
            --message-in: #182533;
            --message-out: #2b5278;
            --accent-color: #5288c1;
            --text-color: #ffffff;
            --text-secondary: #8793a1;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); height: 100vh; display: flex; flex-direction: column; }
        header { background-color: var(--surface-color); padding: 10px 15px; display: flex; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .avatar { width: 40px; height: 40px; background-color: var(--accent-color); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; margin-left: 12px; }
        .chat-info h2 { font-size: 16px; }
        .chat-info p { font-size: 12px; color: var(--text-secondary); }
        .chat-body { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .message { max-width: 75%; padding: 10px 12px; border-radius: 12px; font-size: 14px; line-height: 1.4; word-wrap: break-word; }
        .message.incoming { background-color: var(--message-in); align-self: flex-start; }
        .message.outgoing { background-color: var(--message-out); align-self: flex-end; }
        .chat-footer { background-color: var(--surface-color); padding: 10px; display: flex; align-items: center; gap: 10px; }
        .chat-footer input { flex: 1; background: transparent; border: none; color: var(--text-color); font-size: 15px; outline: none; }
        .chat-footer input::placeholder { color: var(--text-secondary); }
        .send-btn { background: none; border: none; color: var(--accent-color); font-size: 20px; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <div class="avatar">M</div>
        <div class="chat-info">
            <h2>منبر الشات (Menbr)</h2>
            <p>متصل الآن</p>
        </div>
    </header>

    <div class="chat-body" id="chatBody">
        <div class="message incoming">أهلاً بك في تطبيق Menbr Chat!</div>
    </div>

    <div class="chat-footer">
        <input type="text" id="messageInput" placeholder="رسالة...">
        <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>

    <script>
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if(!text) return;

            const chatBody = document.getElementById('chatBody');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message outgoing';
            msgDiv.textContent = text;
            chatBody.appendChild(msgDiv);

            input.value = '';
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        document.getElementById('messageInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
